<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <meta name="description" content="ECHO RIFT, blind test vidéoludique original jouable en solo ou en multijoueur local.">
  <title>ECHO RIFT — Blind test vidéoludique</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="background" aria-hidden="true">
    <div class="grid-floor"></div>
    <div class="rift rift-a"></div>
    <div class="rift rift-b"></div>
    <div class="stars"></div>
  </div>

  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="Retour à l’accueil">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>ECHO</strong><em>RIFT</em></span>
      </button>
      <div class="topbar-actions">
        <div id="profile-chip" class="profile-chip" aria-live="polite"></div>
        <button class="icon-button" type="button" data-action="settings" aria-label="Paramètres" title="Paramètres">⚙</button>
      </div>
    </header>

    <main id="screen" class="screen" tabindex="-1"></main>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </div>

  <noscript>
    <div class="noscript">ECHO RIFT nécessite JavaScript pour fonctionner.</div>
  </noscript>

  <script src="content.js"></script>
  <script src="storage.js"></script>
  <script src="audio-engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
