<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <meta name="description" content="ECHO RIFT, blind test vidéoludique original jouable en solo ou en multijoueur local.">
  <title>ECHO RIFT — Version autonome jouable</title>
  
  
  <style>
:root {
  color-scheme: dark;
  --bg: #070914;
  --bg-soft: #0d1122;
  --panel: rgba(15, 20, 39, .82);
  --panel-solid: #10162b;
  --panel-light: rgba(26, 34, 62, .86);
  --line: rgba(150, 177, 255, .17);
  --line-strong: rgba(133, 238, 255, .36);
  --text: #f6f8ff;
  --muted: #98a4c4;
  --muted-2: #687494;
  --cyan: #65efff;
  --cyan-deep: #16aeca;
  --violet: #aa71ff;
  --pink: #ff6f9d;
  --gold: #ffd36a;
  --green: #76f7bd;
  --red: #ff587a;
  --radius: 22px;
  --radius-small: 13px;
  --shadow: 0 22px 70px rgba(0, 0, 0, .38);
  --max: 1420px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
}
button, input, select { font: inherit; }
button { color: inherit; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid rgba(101, 239, 255, .8);
  outline-offset: 3px;
}
button:disabled { cursor: not-allowed; opacity: .48; }
button:not(:disabled) { cursor: pointer; }

#background {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  background:
    radial-gradient(circle at 18% 8%, rgba(55, 95, 214, .17), transparent 34%),
    radial-gradient(circle at 83% 12%, rgba(169, 73, 255, .14), transparent 30%),
    linear-gradient(180deg, #090c1a 0%, #060811 70%, #080914 100%);
}
.grid-floor {
  position: absolute;
  left: -35vw;
  right: -35vw;
  bottom: -32vh;
  height: 82vh;
  opacity: .19;
  background-image:
    linear-gradient(rgba(77, 215, 255, .28) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77, 215, 255, .28) 1px, transparent 1px);
  background-size: 72px 72px;
  transform: perspective(580px) rotateX(63deg);
  transform-origin: center bottom;
  mask-image: linear-gradient(to bottom, transparent 0, #000 60%);
}
.stars {
  position: absolute;
  inset: 0;
  opacity: .55;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.82) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(101,239,255,.6) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(177,113,255,.5) 0 1px, transparent 1.5px);
  background-position: 12px 18px, 78px 40px, 30px 95px;
  background-size: 130px 130px, 190px 190px, 260px 260px;
  animation: drift 45s linear infinite;
}
.rift {
  position: absolute;
  width: 34vw;
  height: 34vw;
  min-width: 420px;
  min-height: 420px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .08;
  animation: breathe 8s ease-in-out infinite alternate;
}
.rift-a { left: -10vw; top: 12vh; background: var(--cyan); }
.rift-b { right: -12vw; bottom: -10vh; background: var(--violet); animation-delay: -3.5s; }

@keyframes drift { to { transform: translate3d(-130px, -130px, 0); } }
@keyframes breathe { to { opacity: .14; transform: scale(1.16); } }
@keyframes pulse { 50% { opacity: .35; transform: scale(.82); } }
@keyframes float { 50% { transform: translateY(-6px); } }
@keyframes scan { from { transform: translateX(-130%); } to { transform: translateX(330%); } }
@keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes portal { 0%,100% { box-shadow: 0 0 0 1px rgba(101,239,255,.12), inset 0 0 34px rgba(101,239,255,.03); } 50% { box-shadow: 0 0 0 1px rgba(101,239,255,.35), 0 0 28px rgba(101,239,255,.08), inset 0 0 42px rgba(101,239,255,.07); } }

.app-shell { width: 100%; min-height: 100vh; }
.topbar {
  width: min(calc(100% - 40px), var(--max));
  height: 86px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(142, 167, 225, .12);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  border: 0;
  padding: 8px 0;
  background: transparent;
  letter-spacing: .12em;
}
.brand > span:last-child { display: flex; align-items: baseline; gap: 4px; }
.brand strong { font-size: 1.06rem; font-weight: 900; }
.brand em { color: var(--cyan); font-size: 1.06rem; font-weight: 900; font-style: normal; }
.brand-mark { position: relative; width: 39px; height: 39px; display: inline-grid; place-items: center; }
.brand-mark::before, .brand-mark::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(101,239,255,.58);
  border-radius: 50%;
  transform: rotate(28deg) scaleY(.54);
}
.brand-mark::after { transform: rotate(-28deg) scaleY(.54); border-color: rgba(170,113,255,.56); }
.brand-mark i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 0 0 13px var(--cyan); }
.brand-mark i:first-child { transform: translateX(-12px); }
.brand-mark i:last-child { transform: translateX(12px); }
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.profile-chip {
  min-width: 218px;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto 4px;
  gap: 3px 10px;
  align-items: center;
  padding: 9px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(9, 13, 27, .72);
}
.profile-level { grid-row: 1 / 3; font-size: .7rem; color: var(--cyan); font-weight: 900; letter-spacing: .08em; }
.profile-name { font-size: .82rem; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-xp { height: 4px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; }
.profile-xp i, .round-progress i, .profile-progress-card i {
  display: block;
  width: calc(var(--progress, 0) * 100%);
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--cyan), var(--violet));
  box-shadow: 0 0 12px rgba(101,239,255,.48);
}
.icon-button {
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(13, 18, 35, .78);
  display: inline-grid;
  place-items: center;
  transition: border-color .2s, background .2s, transform .2s;
}
.icon-button:hover:not(:disabled) { border-color: var(--line-strong); background: var(--panel-light); transform: translateY(-1px); }
.icon-button.danger { color: var(--red); }

.screen:focus-visible { outline: none; }
.screen {
  width: min(calc(100% - 40px), var(--max));
  margin: 0 auto;
  padding: 42px 0 72px;
  outline: none;
}
.screen-enter { animation: enter .35s ease both; }
.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(145deg, rgba(19, 25, 48, .91), rgba(11, 15, 30, .86));
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}
.kicker, .eyebrow {
  color: var(--cyan);
  font-size: .7rem;
  font-weight: 900;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.live-dot { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 11px var(--green); animation: pulse 1.8s infinite; }
.button {
  min-height: 46px;
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 0 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-weight: 850;
  letter-spacing: .015em;
  transition: transform .2s, box-shadow .2s, border-color .2s, background .2s;
}
.button:hover:not(:disabled) { transform: translateY(-2px); }
.button.primary { color: #041014; background: linear-gradient(135deg, var(--cyan), #83d5ff); box-shadow: 0 10px 28px rgba(63, 220, 255, .2); }
.button.primary:hover:not(:disabled) { box-shadow: 0 14px 34px rgba(63, 220, 255, .32); }
.button.ghost { color: var(--text); border-color: var(--line); background: rgba(255,255,255,.025); }
.button.ghost:hover:not(:disabled) { border-color: var(--line-strong); background: rgba(101,239,255,.06); }
.button.large { min-height: 55px; padding-inline: 26px; font-size: .98rem; }
.button.full { width: 100%; }
.text-button, .back-button, .danger-button {
  border: 0;
  background: transparent;
  padding: 7px 0;
  color: var(--cyan);
  font-weight: 780;
}
.text-button:hover, .back-button:hover { color: #fff; }
.danger-button { color: var(--red); }
.danger-button:hover { color: #fff; }
.mini-button {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.035);
  padding: 8px 13px;
  font-weight: 800;
  font-size: .76rem;
}
.mini-button:hover:not(:disabled) { border-color: var(--line-strong); }

/* Accueil */
.home-layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(310px, .75fr); gap: 22px; }
.hero-panel { position: relative; min-height: 395px; padding: 52px; overflow: hidden; }
.hero-panel::before {
  content: "";
  position: absolute;
  width: 440px;
  height: 440px;
  right: -155px;
  top: -170px;
  border: 1px solid rgba(101,239,255,.22);
  border-radius: 50%;
  box-shadow: 0 0 0 32px rgba(101,239,255,.025), 0 0 0 68px rgba(170,113,255,.025), inset 0 0 90px rgba(101,239,255,.06);
}
.hero-panel::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 58%, rgba(101,239,255,.035));
  pointer-events: none;
}
.hero-panel h1 { position: relative; margin: 21px 0 17px; max-width: 750px; font-size: clamp(3.2rem, 6vw, 6.4rem); line-height: .86; letter-spacing: -.065em; text-transform: uppercase; }
.hero-panel h1 span { color: transparent; -webkit-text-stroke: 1px rgba(190, 212, 255, .74); text-shadow: 0 0 32px rgba(101,239,255,.1); }
.hero-panel > p { position: relative; max-width: 720px; margin: 0; color: #b4bed8; font-size: 1.02rem; line-height: 1.7; }
.hero-actions { position: relative; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.hero-flags { position: relative; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 25px; }
.hero-flags span, .sector-tags span {
  padding: 6px 9px;
  border: 1px solid rgba(146,167,222,.15);
  border-radius: 999px;
  color: var(--muted);
  background: rgba(255,255,255,.025);
  font-size: .7rem;
  font-weight: 720;
}
.profile-overview { min-height: 395px; padding: 30px; }
.panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.panel-heading h2 { margin: 5px 0 0; font-size: 1.4rem; }
.rank-orb {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(101,239,255,.4);
  border-radius: 50%;
  color: var(--cyan);
  font-size: 1.45rem;
  font-weight: 950;
  background: radial-gradient(circle, rgba(101,239,255,.13), transparent 70%);
  box-shadow: 0 0 24px rgba(101,239,255,.09);
}
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 28px; }
.stat-grid > div { min-height: 89px; padding: 17px; border: 1px solid rgba(148,167,221,.12); border-radius: 14px; background: rgba(255,255,255,.025); }
.stat-grid strong { display: block; font-size: 1.33rem; }
.stat-grid span { display: block; margin-top: 7px; color: var(--muted); font-size: .73rem; }
.latest-achievement { display: flex; align-items: center; gap: 13px; margin-top: 14px; padding: 14px; border: 1px solid rgba(255,211,106,.17); border-radius: 14px; background: rgba(255,211,106,.045); }
.latest-achievement > span { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 50%; color: var(--gold); background: rgba(255,211,106,.1); }
.latest-achievement small, .latest-achievement strong { display: block; }
.latest-achievement small { color: var(--gold); font-size: .6rem; letter-spacing: .12em; }
.latest-achievement strong { margin-top: 3px; font-size: .82rem; }
.latest-achievement.muted { border-color: var(--line); background: rgba(255,255,255,.025); }
.latest-achievement.muted > span, .latest-achievement.muted small { color: var(--muted); }
.section-block { margin-top: 46px; }
.section-title { display: flex; align-items: end; gap: 24px; margin-bottom: 18px; }
.section-title h2 { margin: 4px 0 0; font-size: 1.55rem; }
.section-rule { flex: 1; height: 1px; margin-bottom: 6px; background: linear-gradient(90deg, var(--line), transparent); }
.mode-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.mode-card {
  min-height: 177px;
  padding: 25px;
  border: 1px solid var(--line);
  text-align: left;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: start;
  gap: 17px;
  transition: transform .25s, border-color .25s, background .25s;
}
.mode-card:hover { transform: translateY(-5px); border-color: var(--line-strong); background: linear-gradient(145deg, rgba(25, 38, 65, .96), rgba(11, 15, 30, .9)); }
.mode-icon { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid rgba(101,239,255,.25); border-radius: 15px; color: var(--cyan); font-size: 1.35rem; background: rgba(101,239,255,.055); }
.mode-copy { min-width: 0; }
.mode-copy strong { display: block; margin-top: 4px; font-size: 1rem; }
.mode-copy small { display: block; margin-top: 10px; color: var(--muted); line-height: 1.52; }
.mode-arrow { color: var(--muted-2); font-size: 1.2rem; }
.campaign-card .mode-icon { color: var(--violet); border-color: rgba(170,113,255,.3); background: rgba(170,113,255,.06); }
.utility-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
.utility-card { min-height: 96px; padding: 18px 22px; border: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr auto; gap: 15px; align-items: center; text-align: left; transition: border-color .2s, transform .2s; }
.utility-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
.utility-icon { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 12px; color: var(--cyan); background: rgba(101,239,255,.08); }
.utility-card strong, .utility-card small { display: block; }
.utility-card small { margin-top: 5px; color: var(--muted); }
.utility-card b { color: var(--muted-2); font-size: 1.2rem; }
.utility-card.ready b { color: var(--green); }

/* En-têtes de pages */
.page-header { display: grid; grid-template-columns: 170px 1fr; gap: 20px; align-items: start; margin-bottom: 30px; }
.page-header h1 { margin: 7px 0 6px; font-size: clamp(2rem, 4vw, 4rem); letter-spacing: -.045em; }
.page-header p { margin: 0; max-width: 760px; color: var(--muted); line-height: 1.6; }
.back-button { justify-self: start; margin-top: 4px; color: var(--muted); }

/* Formulaires / configuration */
.setup-layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
.setup-main { display: grid; gap: 18px; }
.form-section { padding: 28px; }
.form-section-title { display: flex; align-items: center; gap: 15px; margin-bottom: 23px; }
.form-section-title > span { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid rgba(101,239,255,.24); border-radius: 12px; color: var(--cyan); font-size: .74rem; font-weight: 900; background: rgba(101,239,255,.05); }
.form-section-title h2 { margin: 0; font-size: 1.18rem; }
.form-section-title p { margin: 4px 0 0; color: var(--muted); font-size: .8rem; }
.form-section-title.small { margin-bottom: 18px; }
.sticky-panel { position: sticky; top: 16px; }
.field { display: grid; gap: 8px; color: #c6cee2; font-size: .77rem; font-weight: 760; }
.field + .field, .field + .switch-row { margin-top: 18px; }
.compact-field { max-width: 260px; margin-bottom: 16px; }
.field input, .field select, .search-field input, .archive-toolbar select, .custom-track-row input {
  width: 100%;
  min-height: 45px;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 0 13px;
  color: var(--text);
  background: rgba(5, 9, 20, .7);
}
select option { background: #11172c; color: #fff; }
.player-name-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
.player-name-field { position: relative; display: grid; gap: 7px; padding: 13px; border: 1px solid rgba(255,255,255,.09); border-radius: 13px; background: linear-gradient(90deg, color-mix(in srgb, var(--player) 8%, transparent), transparent); }
.player-name-field::before { content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 3px; border-radius: 999px; background: var(--player); box-shadow: 0 0 9px var(--player); }
.player-name-field span { color: var(--player); font-size: .68rem; font-weight: 900; letter-spacing: .07em; }
.player-name-field input { min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 11px; color: var(--text); background: rgba(6, 9, 19, .7); }
.source-choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.source-choice { position: relative; min-height: 105px; }
.source-choice input { position: absolute; opacity: 0; pointer-events: none; }
.source-choice > span { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 17px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.022); transition: border-color .2s, background .2s; }
.source-choice b, .source-choice small { display: block; }
.source-choice small { margin-top: 7px; color: var(--muted); line-height: 1.4; }
.source-choice input:checked + span { border-color: var(--cyan); background: rgba(101,239,255,.07); box-shadow: inset 0 0 0 1px rgba(101,239,255,.13); }
.source-choice.disabled { opacity: .45; }
.chip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.check-chip { position: relative; }
.check-chip input { position: absolute; opacity: 0; }
.check-chip span { min-height: 45px; display: flex; align-items: center; gap: 9px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 11px; color: var(--muted); background: rgba(255,255,255,.02); font-size: .78rem; font-weight: 720; transition: .2s; }
.check-chip i { color: var(--chip-accent); font-style: normal; font-size: 1.05rem; }
.check-chip input:checked + span { color: #fff; border-color: color-mix(in srgb, var(--chip-accent) 55%, transparent); background: color-mix(in srgb, var(--chip-accent) 8%, transparent); }
.inline-actions { display: flex; gap: 18px; margin-top: 12px; }
.round-type-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.round-choice { position: relative; }
.round-choice input { position: absolute; opacity: 0; }
.round-choice > span:not(.round-icon) { min-height: 83px; display: flex; flex-direction: column; justify-content: center; padding: 12px 14px 12px 58px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.02); transition: .2s; }
.round-choice .round-icon { position: absolute; z-index: 1; left: 14px; top: 50%; width: 32px; height: 32px; display: grid; place-items: center; transform: translateY(-50%); border-radius: 10px; color: var(--cyan); background: rgba(101,239,255,.07); }
.round-choice b, .round-choice small { display: block; }
.round-choice small { margin-top: 5px; color: var(--muted); line-height: 1.35; }
.round-choice input:checked ~ span:not(.round-icon) { border-color: rgba(101,239,255,.45); background: rgba(101,239,255,.055); }
.fieldset, fieldset.field { border: 0; padding: 0; margin: 0; }
.field legend { margin-bottom: 8px; }
.segmented { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: rgba(5,8,18,.7); }
.segmented label { position: relative; }
.segmented input { position: absolute; opacity: 0; }
.segmented span { min-height: 37px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); font-size: .72rem; }
.segmented input:checked + span { color: #071014; background: var(--cyan); font-weight: 900; }
.switch-row { position: relative; display: flex; justify-content: space-between; gap: 18px; align-items: center; margin-top: 18px; padding: 14px 0; border-top: 1px solid rgba(148,167,221,.1); }
.switch-row b, .switch-row small { display: block; }
.switch-row b { font-size: .82rem; }
.switch-row small { margin-top: 4px; color: var(--muted); font-size: .7rem; }
.switch-row input { position: absolute; right: 0; opacity: 0; }
.switch-row i { flex: 0 0 auto; width: 46px; height: 26px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04); }
.switch-row i::before { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch-row input:checked + i { border-color: rgba(101,239,255,.45); background: rgba(101,239,255,.12); }
.switch-row input:checked + i::before { transform: translateX(19px); background: var(--cyan); box-shadow: 0 0 10px rgba(101,239,255,.55); }
.setup-summary { margin: 22px 0; border-top: 1px solid rgba(148,167,221,.1); }
.setup-summary div { display: flex; justify-content: space-between; gap: 15px; padding: 11px 0; border-bottom: 1px solid rgba(148,167,221,.08); font-size: .75rem; }
.setup-summary span { color: var(--muted); }
.keyboard-note { margin: 14px 0 0; color: var(--muted-2); font-size: .68rem; line-height: 1.5; text-align: center; }
.life-preview { display: flex; align-items: center; gap: 7px; color: var(--cyan); }
.life-preview small { margin-left: 8px; color: var(--muted); }

/* Jeu */
.game-shell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 13px; }
.game-hud { min-height: 72px; display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 21px; padding: 12px 18px; }
.game-exit { width: 37px; height: 37px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.025); color: var(--muted); font-size: 1.25rem; }
.game-exit:hover { color: var(--red); border-color: rgba(255,88,122,.4); }
.round-progress > span { display: block; margin-bottom: 8px; color: var(--muted); font-size: .65rem; font-weight: 850; letter-spacing: .08em; }
.round-progress > div { height: 4px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
.round-type { display: flex; align-items: center; gap: 9px; min-width: 155px; }
.round-type > span { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; color: var(--cyan); background: rgba(101,239,255,.07); }
.round-type small, .round-type strong { display: block; }
.round-type small { color: var(--muted-2); font-size: .55rem; letter-spacing: .1em; }
.round-type strong { margin-top: 2px; font-size: .78rem; }
.timer-wrap { position: relative; width: 50px; height: 50px; display: grid; place-items: center; }
.timer-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-wrap circle { fill: none; stroke: rgba(255,255,255,.09); stroke-width: 3; }
.timer-wrap .timer-ring { stroke: var(--cyan); stroke-linecap: round; stroke-dasharray: 113.1; stroke-dashoffset: calc(113.1 * (1 - var(--timer, 1))); transition: stroke-dashoffset .1s linear; }
.timer-wrap strong { font-size: .82rem; }
.timer-wrap.danger .timer-ring { stroke: var(--red); }
.timer-wrap.danger strong { color: var(--red); }
.question-panel { position: relative; min-height: 315px; padding: 29px 32px 22px; text-align: center; overflow: hidden; }
.question-panel::before { content: ""; position: absolute; left: 15%; right: 15%; top: -140px; height: 260px; border-radius: 50%; background: radial-gradient(ellipse, rgba(101,239,255,.085), transparent 70%); }
.question-status { position: relative; display: inline-flex; align-items: center; gap: 8px; color: var(--cyan); font-size: .67rem; font-weight: 900; letter-spacing: .12em; }
.status-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: pulse 1.5s infinite; }
.question-panel h1 { position: relative; margin: 12px auto 6px; font-size: clamp(1.65rem, 3vw, 2.65rem); letter-spacing: -.035em; }
.question-panel > p { position: relative; margin: 0; color: var(--muted); font-size: .82rem; }
.visualizer-wrap { position: relative; width: min(760px, 100%); height: 120px; margin: 17px auto 0; }
#audio-visualizer { width: 100%; height: 100%; opacity: .9; }
.signal-core { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; display: grid; place-items: center; transform: translate(-50%, -50%); border: 1px solid rgba(101,239,255,.45); border-radius: 50%; color: #fff; background: rgba(9,13,28,.89); box-shadow: 0 0 0 8px rgba(101,239,255,.035), 0 0 32px rgba(101,239,255,.18); }
.signal-core::before, .signal-core::after { content: ""; position: absolute; inset: -14px; border: 1px solid rgba(101,239,255,.13); border-radius: 50%; animation: pulse 2.2s infinite; }
.signal-core::after { inset: -27px; animation-delay: -.7s; }
.audio-controls { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: -1px; }
.audio-controls > span { color: var(--muted-2); font-size: .57rem; letter-spacing: .1em; }
.answer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
.answer-portal {
  position: relative;
  min-height: 112px;
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  align-items: center;
  gap: 16px;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 17px 20px;
  text-align: left;
  background: linear-gradient(120deg, rgba(18,25,48,.93), rgba(10,14,29,.88));
  overflow: hidden;
  transition: transform .18s, border-color .18s, background .18s, opacity .18s;
}
.answer-portal::before { content: ""; position: absolute; left: -80px; top: -80px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(101,239,255,.08), transparent 70%); }
.answer-portal.active { animation: portal 3.2s ease infinite; }
.answer-portal.active:hover { transform: translateY(-3px); border-color: rgba(101,239,255,.6); background: linear-gradient(120deg, rgba(29,47,76,.96), rgba(11,17,35,.91)); }
.portal-index { position: relative; width: 31px; height: 31px; display: grid; place-items: center; border: 1px solid rgba(101,239,255,.25); border-radius: 9px; color: var(--cyan); font-size: .73rem; font-weight: 900; background: rgba(101,239,255,.05); }
.portal-icon { position: relative; width: 45px; height: 45px; display: grid; place-items: center; border-radius: 14px; color: var(--cyan); font-size: 1.22rem; background: rgba(101,239,255,.055); }
.portal-copy { position: relative; min-width: 0; }
.portal-copy strong { display: block; font-size: .97rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.portal-copy small { display: block; margin-top: 6px; color: var(--muted); font-size: .7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.answer-markers { position: relative; display: flex; gap: 4px; }
.answer-markers i { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--player); border-radius: 50%; color: var(--player); background: color-mix(in srgb, var(--player) 12%, #0a0e1c); font-style: normal; font-size: .61rem; font-weight: 950; box-shadow: 0 0 10px color-mix(in srgb, var(--player) 25%, transparent); }
.answer-portal.correct { border-color: rgba(118,247,189,.8); background: linear-gradient(120deg, rgba(25,76,66,.8), rgba(10,26,27,.92)); box-shadow: 0 0 28px rgba(118,247,189,.12); }
.answer-portal.correct .portal-index, .answer-portal.correct .portal-icon { color: var(--green); border-color: rgba(118,247,189,.45); background: rgba(118,247,189,.08); }
.answer-portal.wrong { border-color: rgba(255,88,122,.62); background: linear-gradient(120deg, rgba(78,24,43,.75), rgba(27,10,20,.9)); }
.answer-portal.wrong .portal-index, .answer-portal.wrong .portal-icon { color: var(--red); border-color: rgba(255,88,122,.35); }
.answer-portal.dimmed { opacity: .34; filter: grayscale(.65); }
.player-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.player-strip.many { grid-template-columns: repeat(4, 1fr); }
.player-card { position: relative; min-height: 124px; padding: 14px 15px; overflow: hidden; box-shadow: none; }
.player-card::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 5px 5px 0; background: var(--player); box-shadow: 0 0 13px var(--player); }
.player-card.locked { background: linear-gradient(145deg, color-mix(in srgb, var(--player) 8%, #12182d), rgba(9,13,27,.88)); }
.player-card.correct-player { border-color: rgba(118,247,189,.45); }
.player-card.wrong-player { border-color: rgba(255,88,122,.35); }
.player-head { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 9px; }
.player-badge { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 9px; color: #071016; background: var(--player); font-size: .66rem; font-weight: 950; }
.player-head strong, .player-head small { display: block; }
.player-head strong { font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-head small { margin-top: 2px; color: var(--muted-2); font-size: .52rem; letter-spacing: .07em; white-space: nowrap; }
.player-head > b { font-size: .92rem; }
.player-lives { display: flex; color: var(--muted-2); font-size: .72rem; }
.player-lives i { font-style: normal; }
.player-lives i.alive { color: var(--cyan); text-shadow: 0 0 7px var(--cyan); }
.player-meta { min-height: 21px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 9px; color: var(--muted); font-size: .62rem; }
.player-meta b { color: var(--player); }
.active-buff { padding: 3px 6px; border-radius: 999px; color: var(--cyan); background: rgba(101,239,255,.07); font-size: .54rem; font-weight: 850; }
.module-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 8px; }
.module-row button { min-height: 37px; display: flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid rgba(147,168,222,.13); border-radius: 8px; background: rgba(255,255,255,.025); }
.module-row button:hover:not(:disabled) { border-color: var(--player); background: color-mix(in srgb, var(--player) 7%, transparent); }
.module-row span { color: var(--player); font-size: .66rem; font-weight: 900; }
.module-row small { color: var(--muted); font-size: .48rem; }
.reveal-panel { min-height: 93px; display: grid; grid-template-columns: minmax(240px, 1fr) minmax(260px, auto) auto; align-items: center; gap: 20px; padding: 15px 18px; border-color: rgba(118,247,189,.22); }
.reveal-track { display: flex; align-items: center; gap: 13px; }
.reveal-icon { width: 50px; height: 50px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 14px; color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); font-size: 1.35rem; }
.reveal-track small, .reveal-track h2, .reveal-track p { display: block; margin: 0; }
.reveal-track small { color: var(--green); font-size: .58rem; letter-spacing: .09em; text-transform: uppercase; }
.reveal-track h2 { margin-top: 2px; font-size: 1rem; }
.reveal-track p { margin-top: 3px; color: var(--muted); font-size: .7rem; }
.reveal-results { display: flex; flex-wrap: wrap; gap: 6px; }
.reveal-results > span { display: flex; align-items: center; gap: 5px; padding: 6px 8px; border: 1px solid color-mix(in srgb, var(--player) 25%, transparent); border-radius: 9px; color: var(--muted); font-size: .64rem; }
.reveal-results i { color: var(--player); font-style: normal; font-weight: 950; }
.reveal-results b { color: #fff; }

/* Résultats */
.results-page { max-width: 1120px; margin: 0 auto; }
.results-hero { padding: 43px; text-align: center; }
.winner-orb { position: relative; width: 110px; height: 110px; margin: 17px auto 11px; display: grid; place-items: center; border: 1px solid rgba(101,239,255,.4); border-radius: 50%; background: radial-gradient(circle, rgba(101,239,255,.15), rgba(10,14,29,.5) 64%); box-shadow: 0 0 45px rgba(101,239,255,.12); }
.winner-orb i { position: absolute; inset: -12px; border: 1px dashed rgba(170,113,255,.3); border-radius: 50%; animation: float 3s ease-in-out infinite; }
.winner-orb span { font-size: 2rem; font-weight: 950; color: var(--cyan); }
.results-hero h1 { margin: 12px 0 7px; font-size: clamp(2rem, 4vw, 3.4rem); letter-spacing: -.045em; }
.results-hero p { margin: 0; color: var(--muted); }
.star-result { display: flex; justify-content: center; gap: 9px; margin-top: 18px; font-size: 2rem; color: rgba(255,255,255,.12); }
.star-result .earned, .mini-stars .earned { color: var(--gold); text-shadow: 0 0 14px rgba(255,211,106,.45); }
.results-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; margin-top: 16px; }
.leaderboard-panel, .rewards-panel { padding: 26px; }
.leaderboard { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 8px; }
.leaderboard li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 13px; padding: 13px; border: 1px solid rgba(148,167,221,.12); border-radius: 13px; background: linear-gradient(90deg, color-mix(in srgb, var(--player) 6%, transparent), transparent); }
.rank-number { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--player); font-weight: 950; background: color-mix(in srgb, var(--player) 9%, transparent); }
.rank-player { min-width: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 8px; }
.rank-player i { grid-row: 1 / 3; align-self: center; color: var(--player); font-style: normal; font-size: .65rem; font-weight: 900; }
.rank-player strong, .rank-player small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-player small { color: var(--muted); font-size: .65rem; }
.leaderboard li > b { font-size: 1rem; }
.reward-row { display: flex; align-items: center; gap: 13px; margin-top: 14px; padding: 14px; border: 1px solid rgba(148,167,221,.12); border-radius: 13px; }
.reward-row > span { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--cyan); background: rgba(101,239,255,.07); }
.reward-row strong, .reward-row small { display: block; }
.reward-row small { margin-top: 3px; color: var(--muted); }
.level-up { margin-top: 13px; padding: 10px; border: 1px solid rgba(255,211,106,.3); border-radius: 10px; color: var(--gold); background: rgba(255,211,106,.06); text-align: center; font-size: .7rem; font-weight: 900; letter-spacing: .1em; }
.result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
.result-stats > div { padding: 12px 8px; border-radius: 11px; background: rgba(255,255,255,.025); text-align: center; }
.result-stats strong, .result-stats span { display: block; }
.result-stats span { margin-top: 5px; color: var(--muted); font-size: .63rem; }
.achievement-unlocks { margin-top: 16px; padding: 24px; }
.achievement-unlocks > div { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 13px; }
.achievement-unlocks article { display: flex; align-items: center; gap: 11px; padding: 12px; border: 1px solid rgba(255,211,106,.16); border-radius: 12px; background: rgba(255,211,106,.035); }
.achievement-unlocks article > span { color: var(--gold); font-size: 1.2rem; }
.achievement-unlocks strong, .achievement-unlocks small { display: block; }
.achievement-unlocks small { margin-top: 3px; color: var(--muted); }
.results-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 19px; }

/* Campagne */
.campaign-map { position: relative; padding: 25px; overflow: hidden; }
.campaign-line { position: absolute; left: 64px; top: 72px; bottom: 72px; width: 2px; background: linear-gradient(var(--cyan), var(--violet), rgba(148,167,221,.08)); }
.sector-node { position: relative; z-index: 1; min-height: 152px; display: grid; grid-template-columns: 90px 1fr 215px; align-items: center; gap: 22px; padding: 20px; border-bottom: 1px solid rgba(148,167,221,.1); }
.sector-node:last-child { border-bottom: 0; }
.sector-node.locked { opacity: .42; filter: grayscale(.8); }
.sector-orb { position: relative; width: 68px; height: 68px; display: grid; place-items: center; border: 1px solid rgba(101,239,255,.45); border-radius: 50%; color: var(--cyan); background: #10162c; font-size: 1.4rem; box-shadow: 0 0 0 9px #0d1224, 0 0 26px rgba(101,239,255,.12); }
.sector-orb i { position: absolute; inset: -8px; border: 1px dashed rgba(101,239,255,.2); border-radius: 50%; }
.sector-node.boss .sector-orb { color: var(--violet); border-color: rgba(170,113,255,.58); box-shadow: 0 0 0 9px #0d1224, 0 0 35px rgba(170,113,255,.18); }
.sector-copy small { color: var(--cyan); font-size: .62rem; letter-spacing: .11em; font-weight: 900; }
.sector-copy h2 { margin: 5px 0 7px; font-size: 1.3rem; }
.sector-copy p { margin: 0; max-width: 720px; color: var(--muted); font-size: .77rem; line-height: 1.5; }
.sector-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sector-score { display: grid; justify-items: end; gap: 7px; }
.mini-stars { display: flex; gap: 5px; color: rgba(255,255,255,.13); font-size: 1.1rem; }
.sector-score small { color: var(--muted-2); font-size: .6rem; }
.sector-score .button { min-width: 135px; }

/* Archive */
.archive-toolbar { display: grid; grid-template-columns: minmax(240px, 1fr) 200px 170px auto; gap: 12px; align-items: end; padding: 15px; margin-bottom: 15px; }
.search-field { position: relative; display: block; }
.search-field > span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-field input { padding-left: 40px; }
.archive-toolbar > label:not(.search-field) { display: grid; gap: 5px; color: var(--muted); font-size: .65rem; }
.archive-count { align-self: center; color: var(--cyan); font-size: .75rem; font-weight: 850; white-space: nowrap; }
.track-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.track-card { position: relative; min-height: 212px; padding: 19px; overflow: hidden; box-shadow: none; }
.track-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 80% 10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 40%); pointer-events: none; }
.track-play { position: absolute; z-index: 2; right: 15px; top: 15px; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent); border-radius: 50%; color: var(--accent); background: rgba(8,12,24,.72); }
.track-play:hover, .track-play.playing { background: color-mix(in srgb, var(--accent) 13%, #09101e); box-shadow: 0 0 17px color-mix(in srgb, var(--accent) 20%, transparent); }
.track-symbol { position: relative; width: 53px; height: 53px; display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 16px; color: var(--accent); font-size: 1.4rem; background: color-mix(in srgb, var(--accent) 7%, transparent); }
.track-copy { position: relative; margin-top: 17px; }
.track-copy small { display: block; color: var(--accent); font-size: .58rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.track-copy strong { display: block; margin-top: 5px; min-height: 41px; line-height: 1.25; }
.track-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: .7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-meta { position: absolute; left: 19px; right: 19px; bottom: 16px; display: flex; justify-content: space-between; gap: 10px; color: var(--muted-2); font-size: .58rem; letter-spacing: .07em; }
.track-card:not(.discovered) .track-copy strong { filter: blur(4px); user-select: none; }
.empty-state { grid-column: 1 / -1; min-height: 260px; display: grid; place-items: center; align-content: center; padding: 35px; text-align: center; }
.empty-state > span { font-size: 2rem; color: var(--cyan); }
.empty-state h2 { margin: 12px 0 4px; }
.empty-state p { margin: 0; color: var(--muted); }
.empty-state.inline { min-height: 210px; border: 0; box-shadow: none; background: transparent; }

/* Atelier */
.workshop-overview { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; }
.drop-zone { position: relative; min-height: 285px; display: grid; place-items: center; align-content: center; padding: 35px; text-align: center; border-style: dashed; transition: border-color .2s, background .2s; }
.drop-zone:hover { border-color: var(--line-strong); background: linear-gradient(145deg, rgba(20,38,57,.95), rgba(10,15,29,.9)); }
.drop-zone input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop-icon { width: 72px; height: 72px; display: grid; place-items: center; border: 1px solid rgba(101,239,255,.35); border-radius: 50%; color: var(--cyan); font-size: 2rem; background: rgba(101,239,255,.06); box-shadow: 0 0 28px rgba(101,239,255,.08); }
.drop-zone strong { margin-top: 18px; font-size: 1.2rem; }
.drop-zone small { margin-top: 7px; color: var(--muted); }
.drop-zone b { margin-top: 16px; padding: 7px 11px; border-radius: 999px; color: var(--cyan); background: rgba(101,239,255,.07); font-size: .72rem; }
.drop-zone.ready { border-color: rgba(118,247,189,.3); }
.drop-zone.ready b { color: var(--green); background: rgba(118,247,189,.07); }
.library-status { padding: 27px; text-align: center; }
.status-ring { width: 105px; height: 105px; margin: 17px auto 12px; display: grid; place-items: center; align-content: center; border: 1px solid rgba(255,88,122,.35); border-radius: 50%; background: radial-gradient(circle, rgba(255,88,122,.08), transparent 70%); }
.status-ring.ready { border-color: rgba(118,247,189,.45); background: radial-gradient(circle, rgba(118,247,189,.1), transparent 70%); }
.status-ring strong, .status-ring small { display: block; }
.status-ring strong { font-size: 1.65rem; }
.status-ring small { color: var(--muted); font-size: .55rem; letter-spacing: .11em; }
.library-status h2 { margin: 9px 0 6px; font-size: 1.1rem; }
.library-status p { margin: 0; color: var(--muted); font-size: .75rem; line-height: 1.5; }
.workshop-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.custom-library { margin-top: 16px; padding: 25px; }
.custom-track-list { display: grid; gap: 7px; margin-top: 18px; }
.custom-track-row { display: grid; grid-template-columns: 42px 38px minmax(190px, 1fr) minmax(190px, 1fr) 42px 42px; gap: 8px; align-items: end; padding: 11px; border: 1px solid rgba(148,167,221,.11); border-radius: 13px; background: rgba(255,255,255,.018); }
.custom-index { align-self: center; color: var(--muted-2); font-size: .7rem; font-weight: 850; }
.mini-play { align-self: center; width: 35px; height: 35px; border: 1px solid var(--line); border-radius: 10px; color: var(--cyan); background: rgba(101,239,255,.04); }
.custom-track-row label { display: grid; gap: 4px; color: var(--muted); font-size: .59rem; }
.custom-track-row input { min-height: 38px; }
.custom-track-row .icon-button { width: 38px; height: 38px; }
.legal-note { display: flex; gap: 12px; align-items: center; margin-top: 16px; padding: 15px 18px; box-shadow: none; }
.legal-note span { color: var(--cyan); }

.controls-panel, .module-guide, .scoring-guide { margin-top: 15px; padding: 25px; }
.control-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
.control-grid > div { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 13px; border: 1px solid rgba(148,167,221,.11); border-radius: 13px; }
.control-grid > div > span { grid-column: 1 / -1; margin-bottom: 5px; color: var(--player); font-size: .68rem; font-weight: 900; }
kbd { min-height: 34px; display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--player) 30%, transparent); border-radius: 8px; color: var(--player); background: color-mix(in srgb, var(--player) 6%, transparent); font-family: inherit; font-weight: 900; }
.control-grid small { text-align: center; color: var(--muted-2); font-size: .47rem; }
.module-guide > div:last-child { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
.module-guide article { display: flex; gap: 11px; padding: 14px; border: 1px solid rgba(148,167,221,.11); border-radius: 13px; }
.module-guide article > span { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 10px; color: var(--cyan); background: rgba(101,239,255,.06); font-weight: 900; }
.module-guide strong { font-size: .78rem; }
.module-guide p { margin: 5px 0 0; color: var(--muted); font-size: .66rem; line-height: 1.4; }
.scoring-guide { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; align-items: center; }
.scoring-guide h2 { margin: 5px 0 7px; }
.scoring-guide p { margin: 0; color: var(--muted); line-height: 1.55; }
.score-example { display: grid; grid-template-columns: repeat(3, auto 1fr) 1.2fr; align-items: center; gap: 6px; }
.score-example span { color: var(--muted-2); font-size: .55rem; }
.score-example b { color: var(--cyan); }
.score-example i { color: var(--muted-2); font-style: normal; }
.score-example strong { color: var(--green); text-align: right; }

.settings-layout { max-width: 850px; display: grid; gap: 14px; margin: 0 auto; }
.range-field { grid-template-columns: 1fr auto; }
.range-field input { grid-column: 1 / -1; min-height: auto; padding: 0; accent-color: var(--cyan); background: transparent; }
.profile-progress-card { padding: 17px; border: 1px solid rgba(148,167,221,.12); border-radius: 13px; background: rgba(255,255,255,.02); }

.danger-zone h2 { margin: 5px 0; }
.danger-zone p { margin: 0; color: var(--muted); font-size: .72rem; }

.toast-region { position: fixed; z-index: 100; right: 22px; bottom: 22px; display: grid; gap: 8px; pointer-events: none; }
.toast { max-width: 390px; padding: 13px 16px; border: 1px solid var(--line); border-left-width: 4px; border-radius: 12px; color: #fff; background: rgba(12,17,32,.95); box-shadow: 0 15px 45px rgba(0,0,0,.4); opacity: 0; transform: translateY(8px); transition: .25s; font-size: .78rem; }

.noscript, .fatal-error { max-width: 700px; margin: 80px auto; padding: 30px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel-solid); text-align: center; }
.shake { animation: shake .35s linear; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

/* Contraste et réduction des mouvements */

.reduced-motion *, .reduced-motion *::before, .reduced-motion *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }

    name: 'Récupérateur',
    level: 1,
    xp: 0,
    credits: 0,
    gamesPlayed: 0,
    correctAnswers: 0,
    totalAnswers: 0,
    bestScore: 0,
    bestStreak: 0,
    discovered: [],
    achievements: [],
    campaign: {},
    lastMode: 'solo'
  });

  const defaultSettings = () => ({
    volume: 0.72,
    reducedMotion: false,
    highContrast: false,
    visualizer: true,
    screenShake: true,
    language: 'fr'
  });

  function safeParse(raw, fallback) {
    try {
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === 'object' ? parsed : fallback;
    } catch (_) {
      return fallback;
    }
  }

  function loadProfile() {
    const fallback = defaultProfile();
    let raw = null;
    try { raw = localStorage.getItem(PROFILE_KEY); } catch (_) { raw = null; }
    const stored = safeParse(raw, fallback);
    return Object.assign(fallback, stored, {
      discovered: Array.isArray(stored.discovered) ? stored.discovered : [],
      achievements: Array.isArray(stored.achievements) ? stored.achievements : [],
      campaign: stored.campaign && typeof stored.campaign === 'object' ? stored.campaign : {}
    });
  }

  function saveProfile(profile) {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch (_) { /* stockage désactivé */ }
  }

  function loadSettings() {
    let raw = null;
    try { raw = localStorage.getItem(SETTINGS_KEY); } catch (_) { raw = null; }
    return Object.assign(defaultSettings(), safeParse(raw, {}));
  }

  function saveSettings(settings) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (_) { /* stockage désactivé */ }
  }

  function resetProfile() {
    const profile = defaultProfile();
    saveProfile(profile);
    return profile;
  }

  function xpForLevel(level) {
    return 700 + Math.max(0, level - 1) * 350;
  }

  function addXp(profile, amount) {
    let gainedLevels = 0;
    profile.xp += Math.max(0, Math.round(amount));
    while (profile.xp >= xpForLevel(profile.level)) {
      profile.xp -= xpForLevel(profile.level);
      profile.level += 1;
      profile.credits += 125 + profile.level * 10;
      gainedLevels += 1;
    }
    return gainedLevels;
  }

  function openDb() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) {
        reject(new Error('IndexedDB indisponible dans ce navigateur.'));
        return;
      }
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          store.createIndex('createdAt', 'createdAt');
          store.createIndex('category', 'category');
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Impossible d’ouvrir la bibliothèque audio.'));
    });
  }

  async function transact(mode, callback) {
    const db = await openDb();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, mode);
        const store = tx.objectStore(STORE_NAME);
        let result;
        try {
          result = callback(store, tx);
        } catch (error) {
          reject(error);
          return;
        }
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error || new Error('Erreur de bibliothèque audio.'));
        tx.onabort = () => reject(tx.error || new Error('Transaction annulée.'));
      });
    } finally {
      db.close();
    }
  }

  async function addCustomFiles(files, defaults = {}) {
    const accepted = Array.from(files || []).filter(file => file && file.type && file.type.startsWith('audio/'));
    if (!accepted.length) return [];

    const records = accepted.map((file, index) => {
      const baseName = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
      return {
        id: `custom-${Date.now()}-${index}-${Math.random().toString(36).slice(2, 8)}`,
        title: baseName || `Écho personnalisé ${index + 1}`,
        artist: defaults.artist || 'Bibliothèque personnelle',
        category: defaults.category || 'custom',
        kind: 'music',
        difficulty: Number(defaults.difficulty || 2),
        duration: 0,
        sourceType: 'custom',
        mimeType: file.type,
        fileName: file.name,
        blob: file,
        createdAt: Date.now() + index
      };
    });

    await transact('readwrite', store => {
      records.forEach(record => store.put(record));
    });
    return records.map(stripBlob);
  }

  function stripBlob(record) {
    if (!record) return null;
    const copy = Object.assign({}, record);
    delete copy.blob;
    return copy;
  }

  async function getCustomTracks() {
    const db = await openDb();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const request = tx.objectStore(STORE_NAME).getAll();
        request.onsuccess = () => {
          const rows = (request.result || []).sort((a, b) => a.createdAt - b.createdAt).map(stripBlob);
          resolve(rows);
        };
        request.onerror = () => reject(request.error || new Error('Lecture impossible.'));
      });
    } finally {
      db.close();
    }
  }

  async function getCustomTrackRecord(id) {
    const db = await openDb();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const request = tx.objectStore(STORE_NAME).get(id);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error || new Error('Écho introuvable.'));
      });
    } finally {
      db.close();
    }
  }

  async function updateCustomTrack(id, patch) {
    const db = await openDb();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const read = store.get(id);
        read.onsuccess = () => {
          if (!read.result) {
            reject(new Error('Écho introuvable.'));
            return;
          }
          const next = Object.assign({}, read.result, patch, { id });
          store.put(next);
        };
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error || new Error('Modification impossible.'));
      });
    } finally {
      db.close();
    }
  }

  async function deleteCustomTrack(id) {
    await transact('readwrite', store => store.delete(id));
  }

  async function clearCustomTracks() {
    await transact('readwrite', store => store.clear());
  }

  window.EchoStorage = {
    loadProfile,
    saveProfile,
    loadSettings,
    saveSettings,
    resetProfile,
    addXp,
    xpForLevel,
    addCustomFiles,
    getCustomTracks,
    getCustomTrackRecord,
    updateCustomTrack,
    deleteCustomTrack,
    clearCustomTracks
  };
})();

  <script>
/* audio-engine.js */
(function () {
  'use strict';

  const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
  const OfflineAudioContextCtor = window.OfflineAudioContext || window.webkitOfflineAudioContext;

  function mulberry32(seed) {
    let value = seed >>> 0;
    return function () {
      value += 0x6D2B79F5;
      let t = value;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function midiToFrequency(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  class EchoAudioEngine {
    constructor() {
      this.context = null;
      this.master = null;
      this.analyser = null;
      this.currentSources = [];
      this.bufferCache = new Map();
      this.reverseCache = new Map();
      this.lastPlayback = null;
      this.volume = 0.72;
      this.canvas = null;
      this.canvasContext = null;
      this.visualizerEnabled = true;
      this.visualizerFrame = 0;
      this.loading = new Map();
    }

    async ensureContext() {
      if (!AudioContextCtor) throw new Error('Web Audio n’est pas pris en charge par ce navigateur.');
      if (!this.context) {
        this.context = new AudioContextCtor();
      }
      if (this.context.state === 'suspended') await this.context.resume();
      return this.context;
    }

    setVolume(value) {
      this.volume = clamp(Number(value) || 0, 0, 1);
      if (this.master && this.context) {
        this.master.gain.setTargetAtTime(this.volume, this.context.currentTime, 0.02);
      }
    }

    attachVisualizer(canvas) {
      this.canvas = canvas || null;
      this.canvasContext = canvas ? canvas.getContext('2d') : null;
      if (canvas && !this.visualizerFrame) this.drawVisualizer();
    }

    setVisualizerEnabled(enabled) {
      this.visualizerEnabled = Boolean(enabled);
    }

    async getBuffer(track) {
      if (!track) throw new Error('Écho audio manquant.');
      if (this.bufferCache.has(track.id)) return this.bufferCache.get(track.id);
      if (this.loading.has(track.id)) return this.loading.get(track.id);

      const promise = track.sourceType === 'custom'
        ? this.decodeCustomTrack(track)
        : this.renderProceduralTrack(track);
      this.loading.set(track.id, promise);
      try {
        const buffer = await promise;
        this.bufferCache.set(track.id, buffer);
        return buffer;
      } finally {
        this.loading.delete(track.id);
      }
    }

    async decodeCustomTrack(track) {
      const context = await this.ensureContext();
      const record = await window.EchoStorage.getCustomTrackRecord(track.id);
      if (!record || !record.blob) throw new Error('Le fichier audio personnalisé est introuvable.');
      const arrayBuffer = await record.blob.arrayBuffer();
      return context.decodeAudioData(arrayBuffer.slice(0));
    }

    async renderProceduralTrack(track) {
      if (!OfflineAudioContextCtor) throw new Error('La synthèse audio hors ligne n’est pas prise en charge.');
      const duration = track.duration || (track.kind === 'sfx' ? 5 : 8);
      const sampleRate = 44100;
      const offline = new OfflineAudioContextCtor(2, Math.ceil(duration * sampleRate), sampleRate);
      const compressor = offline.createDynamicsCompressor();
      compressor.threshold.value = -20;
      compressor.knee.value = 18;
      compressor.ratio.value = 5;
      compressor.attack.value = 0.005;
      compressor.release.value = 0.16;
      const out = offline.createGain();
      out.gain.value = 0.78;
      compressor.connect(out);
      out.connect(offline.destination);

      if (track.kind === 'sfx') {
        this.scheduleSfx(offline, compressor, track, duration);
      } else {
        this.scheduleMusic(offline, compressor, track, duration);
      }
      return offline.startRendering();
    }

    createTone(ctx, destination, start, duration, frequency, wave, amplitude, options = {}) {
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      const attack = Math.max(0.003, options.attack == null ? 0.012 : options.attack);
      const release = Math.max(0.01, options.release == null ? 0.08 : options.release);
      const sustainEnd = Math.max(start + attack, start + duration - release);
      oscillator.type = wave || 'sine';
      oscillator.frequency.setValueAtTime(Math.max(20, frequency), start);
      if (options.endFrequency) {
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, options.endFrequency), start + duration);
      }
      if (options.detune) oscillator.detune.value = options.detune;

      gain.gain.setValueAtTime(0.0001, Math.max(0, start));
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, amplitude), start + attack);
      gain.gain.setValueAtTime(Math.max(0.0002, amplitude * (options.sustain == null ? 0.75 : options.sustain)), sustainEnd);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

      let node = gain;
      if (options.filter) {
        const filter = ctx.createBiquadFilter();
        filter.type = options.filter.type || 'lowpass';
        filter.frequency.value = options.filter.frequency || 1800;
        filter.Q.value = options.filter.q || 0.7;
        gain.connect(filter);
        node = filter;
      }
      if (options.pan != null && typeof ctx.createStereoPanner === 'function') {
        const panner = ctx.createStereoPanner();
        panner.pan.value = clamp(options.pan, -1, 1);
        node.connect(panner);
        node = panner;
      }

      oscillator.connect(gain);
      node.connect(destination);
      oscillator.start(Math.max(0, start));
      oscillator.stop(Math.max(0.01, start + duration + 0.02));
      return oscillator;
    }

    createNoise(ctx, destination, start, duration, amplitude, options = {}, random = Math.random) {
      const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let previous = 0;
      for (let i = 0; i < length; i += 1) {
        const white = random() * 2 - 1;
        if (options.color === 'brown') {
          previous = (previous + 0.02 * white) / 1.02;
          data[i] = previous * 3.5;
        } else if (options.color === 'pink') {
          previous = previous * 0.86 + white * 0.14;
          data[i] = previous;
        } else {
          data[i] = white;
        }
      }
      const source = ctx.createBufferSource();
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, amplitude), start + Math.min(0.02, duration * 0.15));
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      source.buffer = buffer;
      source.connect(gain);
      let node = gain;
      if (options.filterFrequency) {
        const filter = ctx.createBiquadFilter();
        filter.type = options.filterType || 'lowpass';
        filter.frequency.value = options.filterFrequency;
        filter.Q.value = options.q || 0.8;
        gain.connect(filter);
        node = filter;
      }
      if (options.pan != null && typeof ctx.createStereoPanner === 'function') {
        const panner = ctx.createStereoPanner();
        panner.pan.value = clamp(options.pan, -1, 1);
        node.connect(panner);
        node = panner;
      }
      node.connect(destination);
      source.start(start);
      source.stop(start + duration + 0.02);
      return source;
    }

    createDelayBus(ctx, destination, delayTime = 0.24, feedbackAmount = 0.25, wet = 0.3) {
      const input = ctx.createGain();
      const dry = ctx.createGain();
      const delay = ctx.createDelay(1.2);
      const feedback = ctx.createGain();
      const wetGain = ctx.createGain();
      dry.gain.value = 1;
      delay.delayTime.value = delayTime;
      feedback.gain.value = feedbackAmount;
      wetGain.gain.value = wet;
      input.connect(dry);
      dry.connect(destination);
      input.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(wetGain);
      wetGain.connect(destination);
      return input;
    }

    scheduleKick(ctx, destination, time, amplitude = 0.35) {
      this.createTone(ctx, destination, time, 0.22, 125, 'sine', amplitude, {
        endFrequency: 42, attack: 0.003, release: 0.15, sustain: 0.3
      });
    }

    scheduleSnare(ctx, destination, time, random, amplitude = 0.18) {
      this.createNoise(ctx, destination, time, 0.18, amplitude, {
        filterFrequency: 1800, filterType: 'bandpass', q: 0.8
      }, random);
      this.createTone(ctx, destination, time, 0.13, 180, 'triangle', amplitude * 0.35, {
        attack: 0.002, release: 0.1
      });
    }

    scheduleHat(ctx, destination, time, random, amplitude = 0.08, open = false) {
      this.createNoise(ctx, destination, time, open ? 0.18 : 0.055, amplitude, {
        filterFrequency: 6500, filterType: 'highpass'
      }, random);
    }

    scheduleMusic(ctx, destination, track, duration) {
      const random = mulberry32(track.seed || 1);
      const beat = 60 / (track.bpm || 110);
      const root = track.root || 48;
      const category = track.category;
      const style = {
        arcade: { scale: [0, 2, 4, 7, 9, 12], lead: 'square', bass: 'triangle', density: 1, octave: 12, delay: 0.11 },
        horror: { scale: [0, 1, 3, 6, 8, 12], lead: 'sine', bass: 'sawtooth', density: 0.45, octave: 0, delay: 0.36 },
        space: { scale: [0, 2, 5, 7, 9, 12], lead: 'sawtooth', bass: 'sine', density: 0.72, octave: 12, delay: 0.31 },
        fantasy: { scale: [0, 2, 4, 7, 9, 12], lead: 'triangle', bass: 'sine', density: 0.75, octave: 12, delay: 0.2 },
        cyber: { scale: [0, 3, 5, 7, 10, 12], lead: 'sawtooth', bass: 'square', density: 0.9, octave: 12, delay: 0.16 },
        industrial: { scale: [0, 1, 5, 6, 7, 10], lead: 'square', bass: 'sawtooth', density: 0.55, octave: 0, delay: 0.08 },
        ocean: { scale: [0, 2, 5, 7, 11, 12], lead: 'sine', bass: 'triangle', density: 0.5, octave: 12, delay: 0.42 },
        desert: { scale: [0, 1, 4, 5, 7, 8, 11, 12], lead: 'triangle', bass: 'sine', density: 0.76, octave: 12, delay: 0.19 },
        dream: { scale: [0, 4, 7, 9, 11, 12], lead: 'sine', bass: 'triangle', density: 0.62, octave: 12, delay: 0.44 },
        mystery: { scale: [0, 3, 5, 7, 10, 12], lead: 'triangle', bass: 'sine', density: 0.6, octave: 12, delay: 0.24 }
      }[category] || { scale: [0, 2, 4, 7, 9], lead: 'triangle', bass: 'sine', density: 0.7, octave: 12, delay: 0.2 };

      const musicBus = this.createDelayBus(ctx, destination, style.delay, category === 'dream' ? 0.42 : 0.24, category === 'horror' ? 0.38 : 0.24);
      const bassBus = ctx.createGain();
      bassBus.gain.value = category === 'horror' || category === 'industrial' ? 0.8 : 0.62;
      bassBus.connect(destination);

      const steps = Math.ceil(duration / (beat / 2));
      const motifLength = 8;
      const motif = [];
      for (let i = 0; i < motifLength; i += 1) {
        let degree = Math.floor(random() * style.scale.length);
        if (i === 0 || i === 4) degree = 0;
        motif.push(style.scale[degree]);
      }

      // Pads / drones give every family a recognizable silhouette.
      if (category === 'horror') {
        const droneRoot = midiToFrequency(root - 12);
        this.createTone(ctx, destination, 0, duration, droneRoot, 'sawtooth', 0.055, {
          attack: 1.2, release: 1.4, sustain: 0.85, filter: { type: 'lowpass', frequency: 420, q: 1.8 }
        });
        this.createTone(ctx, destination, 0.4, duration - 0.5, midiToFrequency(root - 6), 'sine', 0.042, {
          attack: 1.5, release: 1.2, sustain: 0.8, detune: 9
        });
        for (let t = 0.8; t < duration; t += beat * 2) {
          this.createNoise(ctx, destination, t, Math.min(0.8, duration - t), 0.035 + random() * 0.025, {
            color: 'brown', filterFrequency: 900, filterType: 'lowpass', pan: random() * 1.6 - 0.8
          }, random);
        }
      } else if (category === 'ocean') {
        this.createNoise(ctx, destination, 0, duration, 0.045, {
          color: 'pink', filterFrequency: 740, filterType: 'lowpass'
        }, random);
        for (let t = 0.4; t < duration; t += beat * 4) {
          this.createTone(ctx, musicBus, t, Math.min(2.4, duration - t), midiToFrequency(root + 24), 'sine', 0.05, {
            endFrequency: midiToFrequency(root + 17), attack: 0.08, release: 1.4, pan: random() * 1.4 - 0.7
          });
        }
      } else if (category === 'space' || category === 'dream') {
        const chord = [0, 7, category === 'dream' ? 11 : 12];
        for (let t = 0; t < duration; t += beat * 4) {
          chord.forEach((interval, idx) => {
            this.createTone(ctx, musicBus, t, Math.min(beat * 4.4, duration - t), midiToFrequency(root + interval), idx === 0 ? 'sine' : 'triangle', 0.035, {
              attack: 0.5, release: 1.1, sustain: 0.7, detune: idx * 3 - 3
            });
          });
        }
      }

      // Bass line.
      for (let t = 0, step = 0; t < duration - 0.05; t += beat, step += 1) {
        let interval = step % 4 === 3 ? style.scale[Math.min(3, style.scale.length - 1)] : 0;
        if (category === 'mystery' && step % 4 === 2) interval = 10;
        if (category === 'desert' && step % 4 === 2) interval = 1;
        const bassDuration = category === 'industrial' ? beat * 0.42 : beat * 0.78;
        this.createTone(ctx, bassBus, t, Math.min(bassDuration, duration - t), midiToFrequency(root - 12 + interval), style.bass, 0.095, {
          attack: 0.008, release: bassDuration * 0.55,
          filter: { type: 'lowpass', frequency: category === 'cyber' ? 900 : 620, q: 1.1 }
        });
      }

      // Lead motif.
      for (let step = 0; step < steps; step += 1) {
        const time = step * (beat / 2);
        if (time >= duration - 0.08) break;
        if (random() > style.density && step % 4 !== 0) continue;
        const interval = motif[step % motif.length] + (step % 16 >= 12 && category !== 'horror' ? 12 : 0);
        const noteLength = category === 'dream' || category === 'ocean' ? beat * 0.86 : beat * (0.28 + random() * 0.32);
        const amp = category === 'industrial' ? 0.045 : 0.06 + random() * 0.025;
        this.createTone(ctx, musicBus, time, Math.min(noteLength, duration - time), midiToFrequency(root + style.octave + interval), style.lead, amp, {
          attack: category === 'dream' ? 0.04 : 0.006,
          release: category === 'dream' ? noteLength * 0.75 : noteLength * 0.45,
          sustain: 0.55,
          pan: (step % 2 ? 0.28 : -0.28) + (random() - 0.5) * 0.25,
          filter: category === 'cyber' || category === 'industrial'
            ? { type: 'lowpass', frequency: 1450 + random() * 1200, q: 2.2 }
            : undefined
        });
      }

      // Percussion language.
      for (let step = 0, t = 0; t < duration; step += 1, t += beat / 2) {
        const half = step % 2;
        const quarter = Math.floor(step / 2) % 4;
        if (category === 'horror') {
          if (step % 8 === 0) this.scheduleKick(ctx, destination, t, 0.16);
          if (step % 8 === 6 && random() > 0.35) this.createNoise(ctx, destination, t, 0.12, 0.035, { color: 'brown', filterFrequency: 300 }, random);
          continue;
        }
        if (category === 'ocean' || category === 'dream') {
          if (step % 4 === 0) this.scheduleKick(ctx, destination, t, 0.12);
          if (step % 4 === 2) this.scheduleHat(ctx, destination, t, random, 0.035, true);
          continue;
        }
        if (half === 0 && (quarter === 0 || quarter === 2 || category === 'arcade')) {
          this.scheduleKick(ctx, destination, t, category === 'industrial' ? 0.33 : 0.23);
        }
        if (half === 0 && (quarter === 1 || quarter === 3)) {
          this.scheduleSnare(ctx, destination, t, random, category === 'industrial' ? 0.22 : 0.14);
        }
        if (category !== 'fantasy' || step % 2 === 0) {
          this.scheduleHat(ctx, destination, t, random, category === 'arcade' ? 0.065 : 0.045, step % 8 === 7);
        }
        if (category === 'industrial' && step % 4 === 1) {
          this.createTone(ctx, destination, t, 0.08, 700 + random() * 350, 'square', 0.035, { endFrequency: 120, release: 0.06 });
        }
        if (category === 'desert' && step % 4 === 3) {
          this.createTone(ctx, destination, t, 0.075, 220, 'sine', 0.07, { endFrequency: 115, release: 0.05, pan: random() > 0.5 ? 0.45 : -0.45 });
        }
      }

      // Signature earcons ensure each track is learnable and unique.
      const signatureStart = Math.min(duration - 1.25, beat * (1 + Math.floor(random() * 3)));
      const signatureDegrees = [motif[1], motif[3], motif[5]].map((value, i) => value + (i === 2 ? 12 : 0));
      signatureDegrees.forEach((interval, index) => {

        });
      });

            tone(t, 0.3, 150 + i * 45, i % 2 ? 'sine' : 'triangle', 0.055, { endFrequency: 300 + i * 58, release: 0.2, pan: Math.sin(i) * 0.7 });
          }

          tone(2.0, 1.7, 920, 'sine', 0.09, { endFrequency: 110, attack: 0.02, release: 1.2 });

        case 'plasma':
          tone(0.3, 1.8, 80, 'sawtooth', 0.085, { endFrequency: 1120, attack: 0.04, release: 0.2, filter: { type: 'lowpass', frequency: 1600, q: 2.8 } });

            noise(0.31 + i * 0.32, 0.08, 0.08, { filterFrequency: 900, filterType: 'bandpass' });

          tone(2.65, 0.75, 62, 'sine', 0.12, { endFrequency: 38, release: 0.6 });
          break;
        case 'growl':

          }
          break;
        case 'siren':

            tone(0.2 + i * 0.9, 0.82, 420, 'sawtooth', 0.1, { endFrequency: 850, attack: 0.05, release: 0.08, filter: { type: 'lowpass', frequency: 1500, q: 2 } });
          }

        case 'rune':
          [0, 7, 12, 16, 19].forEach((interval, i) => tone(0.2 + i * 0.22, 1.3, midiToFrequency(60 + interval), 'sine', 0.07, { attack: 0.03, release: 0.85, pan: (i - 2) * 0.25 }));
          noise(1.1, 1.5, 0.045, { color: 'pink', filterFrequency: 3600, filterType: 'highpass' });

          tone(1.6, 0.7, 850, 'sine', 0.09, { endFrequency: 120, release: 0.55 });
          break;
        case 'radio':
          noise(0, duration, 0.07, { color: 'pink', filterFrequency: 1800, filterType: 'bandpass', q: 0.7 });

          break;
        case 'scanner':

          break;
        default:
          tone(0.2, 1.5, 220, 'sine', 0.1, { endFrequency: 880, release: 0.8 });
      }
    }

    getReversedBuffer(buffer, cacheKey) {
      const key = `reverse:${cacheKey}`;
      if (this.reverseCache.has(key)) return this.reverseCache.get(key);
      const reversed = this.context.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
      for (let channel = 0; channel < buffer.numberOfChannels; channel += 1) {
        const source = buffer.getChannelData(channel);
        const target = reversed.getChannelData(channel);
        for (let i = 0, j = source.length - 1; i < source.length; i += 1, j -= 1) target[i] = source[j];
      }
      this.reverseCache.set(key, reversed);
      return reversed;
    }

    createPlaybackGraph(options = {}) {
      const ctx = this.context;
      this.master = ctx.createGain();
      this.master.gain.setValueAtTime(this.volume, ctx.currentTime);
      this.analyser = ctx.createAnalyser();
      this.analyser.fftSize = 256;
      this.analyser.smoothingTimeConstant = 0.78;

      let input = this.master;
      if (options.filterFrequency || options.highpassFrequency) {
        const filter = ctx.createBiquadFilter();
        if (options.highpassFrequency) {
          filter.type = 'highpass';
          filter.frequency.value = options.highpassFrequency;
        } else {
          filter.type = 'lowpass';
          filter.frequency.value = options.filterFrequency;
        }
        filter.Q.value = options.filterQ || 1.1;
        filter.connect(this.master);
        input = filter;
      }
      this.master.connect(this.analyser);
      this.analyser.connect(ctx.destination);
      return input;
    }

    stop(fade = 0.035) {
      if (this.master && this.context) {
        try {
          this.master.gain.cancelScheduledValues(this.context.currentTime);
          this.master.gain.setValueAtTime(Math.max(0.0001, this.master.gain.value), this.context.currentTime);
          this.master.gain.exponentialRampToValueAtTime(0.0001, this.context.currentTime + fade);
        } catch (_) { /* no-op */ }
      }
      const sources = this.currentSources.slice();
      this.currentSources.length = 0;
      setTimeout(() => {
        sources.forEach(source => {
          try { source.stop(); } catch (_) { /* already stopped */ }
          try { source.disconnect(); } catch (_) { /* no-op */ }
        });
      }, Math.ceil((fade + 0.02) * 1000));
    }

    async play(track, options = {}) {
      await this.ensureContext();
      this.stop();
      const bufferOriginal = await this.getBuffer(track);
      const buffer = options.reverse ? this.getReversedBuffer(bufferOriginal, track.id) : bufferOriginal;
      const source = this.context.createBufferSource();
      source.buffer = buffer;
      source.playbackRate.value = options.rate || 1;
      const graphInput = this.createPlaybackGraph(options);
      source.connect(graphInput);

      let offset = Math.max(0, Number(options.offset) || 0);
      const requestedDuration = Number(options.duration) || Math.min(track.duration || 8, 8);
      const maximumOffset = Math.max(0, buffer.duration - requestedDuration * (options.rate || 1) - 0.05);
      offset = Math.min(offset, maximumOffset);
      const safeDuration = Math.min(requestedDuration, Math.max(0.1, (buffer.duration - offset) / (options.rate || 1)));
      source.start(0, offset, safeDuration);
      this.currentSources = [source];
      this.lastPlayback = { kind: 'single', track, options: Object.assign({}, options) };
      return { duration: safeDuration, source };
    }

    async playSequence(tracks, segmentDuration = 1.4, options = {}) {
      await this.ensureContext();
      this.stop();
      const buffers = await Promise.all(tracks.map(track => this.getBuffer(track)));
      const graphInput = this.createPlaybackGraph(options);
      const sources = [];
      let cursor = this.context.currentTime + 0.04;
      buffers.forEach((buffer, index) => {
        const source = this.context.createBufferSource();
        source.buffer = buffer;
        source.playbackRate.value = 1;
        source.connect(graphInput);
        const maxOffset = Math.max(0, buffer.duration - segmentDuration - 0.05);
        const seeded = mulberry32((tracks[index].seed || index + 1) + index * 97);
        const offset = tracks[index].sourceType === 'custom' ? seeded() * maxOffset : 0;
        source.start(cursor, offset, Math.min(segmentDuration, buffer.duration - offset));
        sources.push(source);
        cursor += segmentDuration + 0.24;
      });
      this.currentSources = sources;
      this.lastPlayback = { kind: 'sequence', tracks, segmentDuration, options: Object.assign({}, options) };
      const total = tracks.length * segmentDuration + Math.max(0, tracks.length - 1) * 0.24;
      return { duration: total, sources };
    }

    async replay() {
      if (!this.lastPlayback) return;
      const last = this.lastPlayback;
      if (last.kind === 'sequence') return this.playSequence(last.tracks, last.segmentDuration, last.options);
      return this.play(last.track, last.options);
    }

    drawVisualizer() {
      this.visualizerFrame = requestAnimationFrame(() => this.drawVisualizer());
      if (!this.canvas || !this.canvasContext) return;
      const canvas = this.canvas;
      const ctx = this.canvasContext;
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.min(2, window.devicePixelRatio || 1);
      const width = Math.max(1, Math.floor(rect.width * ratio));
      const height = Math.max(1, Math.floor(rect.height * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      ctx.clearRect(0, 0, width, height);
      const bars = 48;
      let data = null;
      if (this.analyser && this.visualizerEnabled) {
        data = new Uint8Array(this.analyser.frequencyBinCount);
        this.analyser.getByteFrequencyData(data);
      }
      const gap = Math.max(2, width * 0.003);
      const barWidth = (width - gap * (bars - 1)) / bars;
      const now = performance.now() * 0.002;
      for (let i = 0; i < bars; i += 1) {
        const value = data ? data[Math.floor((i / bars) * data.length)] / 255 : 0.06 + Math.sin(now + i * 0.35) * 0.025;
        const h = Math.max(height * 0.04, value * height * 0.85);
        const x = i * (barWidth + gap);
        const y = (height - h) / 2;
        const hue = 180 + (i / bars) * 105;
        const gradient = ctx.createLinearGradient(0, y, 0, y + h);
        gradient.addColorStop(0, `hsla(${hue}, 95%, 72%, .9)`);
        gradient.addColorStop(1, `hsla(${hue + 30}, 85%, 48%, .28)`);
        ctx.fillStyle = gradient;
        ctx.fillRect(x, y, Math.max(1, barWidth), h);
      }
    }
  }

  window.EchoAudio = new EchoAudioEngine();
})();

      [copy[i], copy[j]] = [copy[j], copy[i]];
